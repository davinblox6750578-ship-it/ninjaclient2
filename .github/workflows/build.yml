name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair zip
        run: unzip -q -o *.zip
      - name: Corrigir settings.gradle
        run: |
          cat > ninjaclient/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ninjaclient'
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        working-directory: ninjaclient
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient-jar
          path: ninjaclient/build/libs/*.jar
          
